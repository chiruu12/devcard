[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devcard"
version = "0.1.0"
description = "Auto-generate structured, agent-readable developer identity cards from GitHub profiles"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Chirag", email = "chiragzana@gomanzanas.com" }]
keywords = ["developer", "github", "cli", "identity", "svg", "mcp", "ai-agents", "devcard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "diskcache>=5.6",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "python-toon>=0.1.3",
]

[project.optional-dependencies]
enrich = ["openai>=1.0"]
png = ["cairosvg>=2.7"]

[project.urls]
Homepage = "https://github.com/chiruu12/devcard"
Repository = "https://github.com/chiruu12/devcard"
Issues = "https://github.com/chiruu12/devcard/issues"

[project.scripts]
devcard = "devcard.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devcard"]

[tool.hatch.build.targets.wheel.force-include]
"mappings" = "devcard/_data/mappings"
"schema" = "devcard/_data/schema"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
