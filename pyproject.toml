[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devcard"
version = "0.1.0"
description = "Auto-generate structured, agent-readable developer identity cards from GitHub profiles"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "diskcache>=5.6",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
enrich = ["litellm>=1.0"]
png = ["cairosvg>=2.7"]

[project.scripts]
devcard = "devcard.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devcard"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
